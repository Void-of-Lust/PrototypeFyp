<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Tempahan Minuman</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .app-header { background-color: #2c3e50; color: white; padding: 15px; text-align: center; font-weight: bold; }
        .table-badge { background-color: #e74c3c; color: white; padding: 5px 12px; border-radius: 15px; font-size: 0.9rem; }
        .card-drink { border: none; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 15px; }
        .btn-custom { background-color: #27ae60; color: white; font-weight: 600; }
        .btn-custom:hover { background-color: #219150; color: white; }
    </style>
</head>
<body>
    <div class="container max-w-md my-0 p-0" style="max-width: 600px;">
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
