{% extends 'base.html' %}

{% block content %}
<div class="app-header shadow-sm d-flex justify-content-between align-items-center">
    <span>🥤 SISTEM TEMPAHAN MINUMAN</span>
    <span class="table-badge">MEJA: {{ table_number }}</span>
</div>

<div class="p-3">
    <div class="alert alert-info py-2 mb-3" role="alert">
        <strong>Peringatan:</strong> Sila pastikan nombor meja anda adalah tepat.
    </div>

    <!-- Category Filter Tabs -->
    <div class="d-flex gap-2 mb-3">
        <button type="button" class="btn btn-sm btn-dark flex-fill filter-btn active" onclick="filterCategory('all', this)">Semua</button>
        <button type="button" class="btn btn-sm btn-outline-dark flex-fill filter-btn" onclick="filterCategory('Panas', this)">🔥 Panas</button>
        <button type="button" class="btn btn-sm btn-outline-dark flex-fill filter-btn" onclick="filterCategory('Sejuk', this)">🧊 Sejuk</button>
    </div>

    <form action="/order" method="POST" id="orderForm">
        <input type="hidden" name="table_number" value="{{ table_number }}">

        {% for drink in drinks %}
        <div class="card card-drink p-3 drink-item" data-category="{{ drink.kategori }}">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <div>
                    <h6 class="fw-bold mb-0">{{ drink.nama_minuman }}</h6>
                    <small class="text-muted">RM {{ "%.2f"|format(drink.harga) }} • <span class="badge bg-light text-dark border">{{ drink.kategori }}</span></small>
                </div>
                <div class="input-group style-select" style="width: 120px;">
                    <input type="number" class="form-control text-center quantity-input"
                           name="qty_{{ drink.id_menu }}" value="0" min="0" max="10">
                </div>
            </div>
            <input type="text" class="form-control form-control-sm mt-1"
                   name="notes_{{ drink.id_menu }}" placeholder="Nota tambahan (e.g. Kurang Manis, Ais Lebih)">
        </div>
        {% endfor %}

        <button type="submit" class="btn btn-custom w-100 py-2 mt-3 shadow-sm">HANTAR PESANAN</button>
    </form>
</div>

<script>
function filterCategory(category, btn) {
    document.querySelectorAll('.filter-btn').forEach(b => {
        b.classList.remove('btn-dark', 'active');
        b.classList.add('btn-outline-dark');
    });
    btn.classList.remove('btn-outline-dark');
    btn.classList.add('btn-dark', 'active');

    document.querySelectorAll('.drink-item').forEach(item => {
        if (category === 'all' || item.dataset.category === category) {
            item.style.display = 'block';
        } else {
            item.style.display = 'none';
        }
    });
}
</script>
{% endblock %}
