{% extends 'base.html' %}

{% block content %}
<div class="app-header shadow-sm d-flex justify-content-between align-items-center">
    <span>🥤 SISTEM TEMPAHAN MINUMAN</span>
    <span class="table-badge">MEJA: {{ table_number }}</span>
</div>

<div class="p-3">
    <div class="alert alert-info py-2" role="alert">
        <strong>Peringatan:</strong> Sila pastikan nombor meja anda adalah tepat.
    </div>

    <h5 class="fw-bold mb-3">Senarai Minuman</h5>

    <form action="/order" method="POST" id="orderForm">
        <input type="hidden" name="table_number" value="{{ table_number }}">

        {% for drink in drinks %}
        <div class="card card-drink p-3">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <div>
                    <h6 class="fw-bold mb-0">{{ drink.nama_minuman }}</h6>
                    <small class="text-muted">RM {{ "%.2f"|format(drink.harga) }}</small>
                </div>
                <div class="input-group style-select" style="width: 120px;">
                    <input type="number" class="form-control text-center quantity-input"
                           name="qty_{{ drink.id_menu }}" value="0" min="0" max="10">
                </div>
            </div>
            <input type="text" class="form-control form-control-sm mt-1"
                   name="notes_{{ drink.id_menu }}" placeholder="Nota tambahan (e.g. Kurang Manis, Ais Lebih)">
        </div>
        {% endfor %}

        <button type="submit" class="btn btn-custom w-100 py-2 mt-3 shadow-sm">HANTAR PESANAN</button>
    </form>
</div>
{% endblock %}
