{% extends 'base.html' %}

{% block content %}
<div class="app-header bg-dark text-white text-center py-3">
    <h5 class="mb-0 fw-bold">LOG MASUK STAF</h5>
</div>

<div class="p-4">
    {% if error %}
    <div class="alert alert-danger py-2 mb-3" role="alert">
        {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/login">
        <div class="mb-3">
            <label class="form-label fw-semibold">Peranan (Role)</label>
            <select name="role" class="form-select" required>
                <option value="admin">Pengurus (Admin)</option>
                <option value="dapur">Petugas Dapur</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold">Nama Pengguna</label>
            <input type="text" name="username" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold">Kata Laluan</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2">Log Masuk</button>
    </form>
</div>
{% endblock %}
